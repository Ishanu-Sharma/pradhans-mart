<div class="wrap">
  <div class="page-head">
    <h1>Your order</h1>
    <p><a href="/account">All your orders</a> <span class="live-dot" id="live-state" data-state="off" hidden>Connecting</span></p>
  </div>
</div>

<div class="wrap">
  <div id="order-alert" role="alert"></div>
  <div id="order-view" hidden>
    <div class="status-card" id="status-card">
      <p class="small" id="order-id"></p>
      <p class="status-big" id="status-text" role="status" aria-live="polite"></p>
      <p id="status-sub"></p>
    </div>
    <div class="track-grid">
      <section class="panel" aria-labelledby="progress-title">
        <h2 id="progress-title">Progress</h2>
        <ol class="timeline" id="timeline"></ol>
        <div class="rider-box" id="rider-box" hidden>
          <p id="rider-text" aria-live="polite"></p>
        </div>
        <div class="step-actions" id="cancel-row" hidden></div>
      </section>
      <section class="panel" aria-labelledby="items-title">
        <h2 id="items-title">Items</h2>
        <ul class="review-lines" id="order-lines"></ul>
        <dl class="summary" id="order-totals"></dl>
        <div id="order-address"></div>
      </section>
    </div>
  </div>
</div>
