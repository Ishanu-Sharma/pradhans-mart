<div class="wrap staff-main narrow">
  <form id="login" class="panel login-box" novalidate hidden>
    <h1>Rider sign-in</h1>
    <div id="login-alert" role="alert"></div>
    <div class="field">
      <label for="code">Rider code</label>
      <span class="hint" id="code-hint">The 10-character code the store gave you</span>
      <input class="input" id="code" autocomplete="off" autocapitalize="characters" aria-describedby="code-hint" required>
      <p class="error" id="code-error" hidden></p>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <div id="deliveries" hidden>
    <h1 id="rider-hello">Your deliveries</h1>
    <p class="live-dot" id="live-state" data-state="off">Connecting</p>
    <div class="notice notice-info">
      <p>While an order is out for delivery, this page shares your location with that customer and the store. Sharing stops when you mark the order delivered or close this page. Locations are not saved.</p>
    </div>
    <div id="rider-alert" role="status" aria-live="polite"></div>
    <div id="rider-orders"></div>
  </div>
</div>
