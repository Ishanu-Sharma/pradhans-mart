<div class="wrap shop-top">
  <h1 class="visually-hidden">Shop</h1>
  <div id="store-status"></div>
  <section aria-labelledby="cat-title">
    <h2 id="cat-title" class="section-title">Shop by category</h2>
    <div class="tile-row" id="categories" role="group" aria-label="Filter by category"></div>
  </section>
  <section aria-labelledby="results-title">
    <div class="results-head">
      <h2 id="results-title" class="section-title">All products</h2>
      <span class="live-dot" id="live-state" data-state="off">Connecting</span>
    </div>
    <p class="visually-hidden" id="results-status" role="status" aria-live="polite"></p>
    <ul class="product-grid" id="products" aria-labelledby="results-title"></ul>
    <p class="empty-state" id="empty" hidden>No products match your search.</p>
  </section>
</div>

<div class="cart-bar" id="cart-bar" hidden>
  <a href="#cart" data-cart-link-bar><span id="cart-bar-count">0 items</span><span>View cart</span></a>
</div>

<dialog class="drawer" id="cart" aria-labelledby="cart-title">
  <div class="drawer-head">
    <h2 id="cart-title">Your cart</h2>
    <button type="button" class="btn btn-secondary btn-icon" data-close aria-label="Close cart">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#close"></use></svg>
    </button>
  </div>
  <div class="drawer-body">
    <ul class="cart-lines" id="cart-lines"></ul>
    <p class="empty-state" id="cart-empty">Your cart is empty.</p>
  </div>
  <div class="drawer-foot">
    <dl class="summary" id="cart-summary"></dl>
    <p class="small muted" id="free-note"></p>
    <a class="btn btn-primary btn-block" id="to-checkout" href="/checkout">Go to checkout</a>
  </div>
</dialog>

<dialog class="modal" id="product-dialog" aria-labelledby="pd-title">
  <div class="drawer-head">
    <h2 id="pd-title">Product details</h2>
    <button type="button" class="btn btn-secondary btn-icon" data-close aria-label="Close product details">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#close"></use></svg>
    </button>
  </div>
  <div class="modal-body" id="pd-body"></div>
</dialog>
