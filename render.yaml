services:
  - type: web
    name: pradhans-mart
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_LOCATION
        value: Singapore (Render servers)
      - key: ADMIN_PASSWORD
        generateValue: true
